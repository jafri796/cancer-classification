training:
  batch_size: 32
  epochs: 50
  optimizer:
    type: adamw
    lr: 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8
  lr_scheduler:
    type: cosine_annealing_warm_restarts
    T_0: 10
    T_mult: 2
    eta_min: 1e-7
    warmup_epochs: 5
  loss:
    type: focal_loss
    focal_alpha: 0.25
    focal_gamma: 2.0
  mixed_precision:
    enabled: true
  gradient_clipping:
    enabled: true
    max_norm: 1.0
  accumulation_steps: 2
  early_stopping:
    patience: 15
    min_delta: 0.0001
  two_phase:
    enabled: true
    phase1_epochs: 5
    phase2_epochs: 45
  seed: 42